name: Decision or evidence needed (default in force)
description: A fact only the operator, a technician or a regulator can supply. Work continues on the default meanwhile.
labels: [external-decision]
body:
  - type: textarea
    id: needed
    attributes:
      label: What is needed, and from whom
    validations: { required: true }
  - type: textarea
    id: observed
    attributes:
      label: Observed now
      description: The measurement that frames the question.
    validations: { required: true }
  - type: textarea
    id: default
    attributes:
      label: Default in force
      description: What the agent does if this stays unanswered. Required; "none", "n/a" and "TBD" are not defaults.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations: { required: true }
