name: Work item
description: A defect, architecture change, verification gap or process change. This Issue is the backlog entry; there is no other list.
labels: []
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind (apply the matching label after filing)
      options: [customer-defect, architecture, qa-verification, process]
    validations: { required: true }
  - type: textarea
    id: observed
    attributes:
      label: Observed now
      description: What is true today, with how you checked (command, test, run link). Separate what you measured from what an older record claims.
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: The customer or architectural result, in the owning layer's terms (COMPONENT_LAYER_MAP.md).
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable conditions. A PR closes this Issue with `Fixes #n` only if it satisfies every one; otherwise use `Refs #n`.
    validations: { required: true }
  - type: textarea
    id: spec
    attributes:
      label: Owner layer, specification and Charter constraints
    validations: { required: false }
